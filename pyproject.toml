[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-tls-interop"
version = "0.1.0"
description = "TLS 1.3 hybrid key exchange (X25519MLKEM768 / RFC 10024) endpoint probe, downgrade detector, and key material validator."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "tls", "hybrid", "rfc-10024", "ml-kem", "x25519", "interop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
pqblocks-tls-interop = "pqblocks_tls_interop.verifier.probe:main"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/PQBlocks/tls-hybrid-interop"
Documentation = "https://github.com/PQBlocks/tls-hybrid-interop#readme"
Source = "https://github.com/PQBlocks/tls-hybrid-interop"
Changelog = "https://github.com/PQBlocks/tls-hybrid-interop/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/tls-hybrid-interop/issues"
Security = "https://github.com/PQBlocks/tls-hybrid-interop/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
